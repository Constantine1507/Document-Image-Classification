name: Validate project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install compatible CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install -r requirements-dev.txt
      - name: Check source, documentation, notebook, and provenance
        run: python scripts/validate_repository.py
      - name: Verify archived and latest submission identity
        run: python scripts/verify_submissions.py
      - name: Check AMP policy and CPU behavior
        run: python tests/runtime_test.py
      - name: Test data, training, resume, ensemble, and both backbones
        run: python tests/smoke_test.py
      - name: Execute the self-contained notebook on synthetic data
        run: python tests/notebook_smoke.py
